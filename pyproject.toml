[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleglass"
version = "0.3.0"
description = "Offline analyser and packet tracer for iptables-save rulesets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ruleglass = "ruleglass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
